name: Build FastVoxel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig cmake build-essential

      - name: Build and install FastVoxel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -v

      - name: Test library
        run: |
          python -m pytest

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          brew install swig cmake

      - name: Build and install FastVoxel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -v

      - name: Test library
        run: |
          python -m pytest

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          choco install swig cmake --no-progress --yes

      - name: Build and install FastVoxel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -v

      - name: Test library
        run: |
          python -m pytest
